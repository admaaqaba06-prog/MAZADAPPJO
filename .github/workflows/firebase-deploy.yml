name: Deploy Firebase (rules, storage, functions)

# Keeps the Firebase backend in sync with main. Vercel already auto-deploys the
# FRONTEND on merge to main; this does the same for Firestore rules, Storage
# rules, and Cloud Functions — so the server never runs stale rules/functions
# while the frontend is current.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Functions dependencies
        # functions/ has no package-lock.json, so use `npm install` (not `npm ci`).
        run: npm install --prefix functions

      # Official Google auth: writes the service-account key from the secret and
      # exports GOOGLE_APPLICATION_CREDENTIALS for all following steps. firebase-tools
      # authenticates via those Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Write the n8n webhook URL into functions/.env so the deployed functions
      # can read process.env.N8N_WEBHOOK_URL. If the secret is unset/empty, the
      # var is empty and postToN8n() no-ops — the notification pipe stays inert.
      # functions/.env is git-ignored; it exists only on the CI runner.
      - name: Configure Functions env (n8n webhook)
        run: echo "N8N_WEBHOOK_URL=${{ secrets.N8N_WEBHOOK_URL }}" > functions/.env

      - name: Deploy rules, storage, and functions
        run: firebase deploy --only firestore:rules,storage,functions --project mazadjoapp --non-interactive --force
