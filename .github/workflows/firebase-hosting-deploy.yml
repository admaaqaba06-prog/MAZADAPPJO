name: Deploy Firebase Hosting (frontend)

# Replaces Vercel's auto-deploy-on-merge for the frontend now that the app is
# on Firebase Hosting. firebase-deploy.yml keeps handling Firestore rules,
# Storage rules, and Cloud Functions; this workflow builds and ships the
# static frontend (dist/) on every push to main, same trigger shape Vercel
# used to run.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Official Google auth: writes the service-account key from the secret and
      # exports GOOGLE_APPLICATION_CREDENTIALS for all following steps. firebase-tools
      # authenticates via those Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting
        run: firebase deploy --only hosting --project mazadjoapp --non-interactive --force
