<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA Core Setup -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Overwritten at boot by the theme script below: 'default' (light bar, dark
         text) under light, 'black-translucent' under dark. The value here is only
         what ships in the HTML before that script runs. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mazzado" />

    <!-- Pre-paint theme. MUST be inline, synchronous, and before any stylesheet:
         anything deferred runs after the first paint, so the page flashes light
         before flipping to dark on every cold load.

         Sits after the two <meta> tags above because it rewrites them.

         This DUPLICATES src/utils/themeBoot.ts on purpose — it runs before the
         bundle exists, so it cannot import it. Keep the two in step; the logic
         is tested there.

         The try/catch is load-bearing: localStorage access THROWS in private
         mode and some embedded webviews, and an uncaught throw here renders a
         blank page. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var s = window.localStorage.getItem('mazad.theme');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0F0F10' : '#FFFFFF');
        var b = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (b) b.setAttribute('content', t === 'dark' ? 'black-translucent' : 'default');
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS Add-to-Home-Screen needs a real raster icon (it ignores SVG manifest icons). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Standard SEO Meta Tags -->
    <title>MAZZADO | Ultra-Premium Live Commerce & Social Auctions</title>
    <meta name="description" content="Jordan's live-video auction marketplace. Bid on cars, watches, electronics, and real estate in live auctions. Pay via CliQ — Mazad holds your payment until you confirm receipt." />
    <meta name="keywords" content="mazzado, jordan auctions, luxury auction amman, live video commerce, cliq payments, watches jordan, cars jordan, real estate amman" />
    <meta name="author" content="MAZZADO Ltd." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.mazzado.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mazzado.com" />
    <meta property="og:title" content="MAZZADO | Ultra-Premium Live Commerce & Social Auctions" />
    <meta property="og:description" content="Live video auctions in Jordan. Bid in real time, pay via CliQ, and Mazad holds your payment until you receive and confirm your item." />
    <!-- The 1200x630 preview this TODO asked for now exists: /og-image.png, the
         MAZZADO lockup centred on the dark plate the artwork ships on, generated
         from public/logo-mazzado.png. A raster PNG at an ABSOLUTE url, because
         the note that removed the old reference was right — SVG and relative
         urls do not render on WhatsApp or Twitter. The icons that note called
         corrupted were re-encoded from the new artwork in the same pass. -->
    <meta property="og:image" content="https://www.mazzado.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAZZADO" />
    <meta property="og:site_name" content="MAZZADO" />
    <meta property="og:locale" content="ar_JO" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <!-- summary_large_image now that a real 1200x630 exists: `summary` renders a
         small square thumbnail and would crop the wide lockup to its middle. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.mazzado.com/og-image.png" />
    <meta name="twitter:image:alt" content="MAZZADO" />
    <meta name="twitter:url" content="https://www.mazzado.com" />
    <meta name="twitter:title" content="MAZZADO | Live Commerce & Luxury Auctions" />
    <meta name="twitter:description" content="Live video shopping and luxury auctions in Jordan. Pay via CliQ — your payment is held by Mazad until you confirm receipt." />

    <!-- The boot-splash mark, preloaded so the very first painted frame already
         has it. fetchpriority=high because it IS the LCP element: everything
         else on that screen is a background and one line of text. -->
    <link rel="preload" as="image" href="/icon-512.png" fetchpriority="high" />

    <!-- Preconnect to Google Fonts & non-blocking font load (media=print → all swap) for swift text LCP -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" />
    </noscript>

    <!-- Structured Data: JSON-LD for Search Indexing -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "@id": "https://www.mazzado.com#organization",
        "name": "MAZZADO",
        "url": "https://www.mazzado.com",
        "logo": "https://www.mazzado.com/icon-512.png",
        "description": "Jordan's live commerce platform for luxury auctions. Buyers pay via CliQ and Mazad holds the payment until the buyer receives and confirms the item.",
        "currenciesAccepted": "JOD",
        "paymentAccepted": "Bank Transfer, CliQ, Credit Card",
        "areaServed": {
          "@type": "Country",
          "name": "Jordan"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.mazzado.com/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Inline Critical CSS for the loading splash to achieve LCP < 2.5s -->
    <style id="critical-path-css">
      html, body {
        margin: 0;
        padding: 0;
        /* #fafafa until 2026-08-25. A light body behind a #0D0D0F splash is a
           white flash on every cold load — the exact thing the splash exists to
           prevent. index.css takes over per theme once it loads. */
        background-color: #0D0D0F;
        color: #EDEDF0;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Tajawal", ui-sans-serif, system-ui, sans-serif;
        box-sizing: border-box;
      }
      *, *::before, *::after {
        box-sizing: inherit;
      }
      /* Boot splash, critical copy.
         DUPLICATES the .boot-splash block in src/index.css on purpose: this has
         to paint before that stylesheet exists. Keep the two in sync —
         boot-splash.wiring.test.ts fails if they drift. */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background-color: #0D0D0F;
        opacity: 1;
        transition: opacity 200ms ease-out;
      }
      .boot-splash--out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash__mark {
        position: relative;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
      }
      @media (min-width: 768px) {
        .boot-splash__mark { width: 72px; height: 72px; }
      }
      .boot-splash__mark::before {
        content: '';
        position: absolute;
        inset: -55%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(252, 105, 3, 0.50) 0%,
          rgba(252, 105, 3, 0.16) 45%,
          rgba(252, 105, 3, 0) 72%
        );
        filter: blur(18px);
        animation: boot-glow 1.4s ease-in-out infinite;
        z-index: 0;
      }
      .boot-splash__mark img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: boot-breathe 1.4s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(0.96); }
        50%      { transform: scale(1.04); }
      }
      @keyframes boot-glow {
        0%, 100% { opacity: 0.45; transform: scale(0.97); }
        50%      { opacity: 0.85; transform: scale(1.05); }
      }
      .boot-splash__label {
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: rgba(237, 237, 240, 0.78);
        margin: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__mark img,
        .boot-splash__mark::before { animation: none; }
        .boot-splash__mark img { transform: none; }
        .boot-splash__mark::before { opacity: 0.6; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Boot splash. A SIBLING of #root, not a child: createRoot() replaces
         #root's children the instant React mounts, so a splash inside it can
         only ever cut, never fade. Out here it survives the mount and
         src/main.tsx fades it once the app has actually painted — no timer, no
         artificial delay. aria-busy + role=status so a screen reader announces
         the wait instead of reading a decorative image. -->
    <div id="boot-overlay" class="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-splash__mark">
        <img src="/icon-512.png" alt="" width="72" height="72" decoding="async" fetchpriority="high" />
      </div>
      <p class="boot-splash__label">جارٍ فتح مزاد…</p>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
