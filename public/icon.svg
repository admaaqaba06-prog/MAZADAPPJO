<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E05300" />
    </linearGradient>

    <!-- Accent Silver Gradient -->
    <linearGradient id="metalSilver" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E9EAB" />
      <stop offset="100%" stop-color="#EEF2F3" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f1f1f" stroke-width="4" />

  <!-- Inner Concentric Tech Rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="8,8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.15" />

  <!-- The "M" Logo Symbolizing a Luxury Gavel and Auction Graph -->
  <g filter="url(#glowEffect)">
    <!-- Main Crown / Gavel Silhouette forming an 'M' -->
    <path d="M 128 384 
             L 128 176 
             C 128 160, 140 144, 160 144 
             C 180 144, 192 160, 192 176 
             L 192 280
             L 256 200
             L 320 280
             L 320 176
             C 320 160, 332 144, 352 144
             C 372 144, 384 160, 384 176
             L 384 384"
          fill="none" 
          stroke="url(#neonOrange)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Gavel Core Pivot Base -->
    <path d="M 200 384 L 312 384" 
          stroke="url(#metalSilver)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Center Tech Node -->
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" filter="drop-shadow(0 0 6px #FF6B00)" />
  </g>

  <!-- Arabic Luxury Framing Accent -->
  <text x="256" y="445" 
        fill="#8E9EAB" 
        font-family="'Inter', sans-serif" 
        font-size="20" 
        font-weight="900" 
        letter-spacing="6" 
        text-anchor="middle" 
        opacity="0.7">MAZAD JO</text>
</svg>
